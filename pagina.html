<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$titulo · Indicadores EFQM 2028</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; color: #172637; background: white; font-family: system-ui, sans-serif; }
header { border-bottom: 1px solid #dfe5ec; }
h1 { max-width: 1600px; margin: auto; padding: 16px clamp(20px, 4.7vw, 75px);
     font-size: clamp(1rem, 2vw, 1.25rem); font-weight: 650; }
main { max-width: 1600px; margin: auto; }
.indicador { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center;
             margin: 16px clamp(20px, 4.7vw, 75px) 0; font-size: .9rem; font-weight: 650; }
select { max-width: 100%; min-width: 0; padding: 7px; border: 1px solid #b1c0d1;
         border-radius: 5px; background: white; color: #172637; font: inherit; }
#opciones { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px;
            margin: 16px clamp(20px, 4.7vw, 75px) 0; padding: 12px 16px;
            background: #f5f8fb; border: 1px solid #dfe5ec; border-radius: 8px; font-size: .85rem; }
fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
legend { padding: 0; font-weight: 650; }
.series { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; align-items: center; }
.series > span { color: #45566a; font-size: .75rem; }
.series > input { justify-self: center; }
label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
input { accent-color: #254d76; }
button { padding: 7px 10px; border: 1px solid #b1c0d1; background: white; border-radius: 5px;
         color: #172637; font: inherit; cursor: pointer; }
#descargar { color: white; border-color: #254d76; background: #254d76; }
#estado:empty { display: none; }
#grafica { overflow-x: auto; }
:focus-visible { outline: 2px solid #365875; outline-offset: 2px; }
#grafica svg { display: block; width: 100%; min-width: 1040px; height: auto; }
</style>
</head>
<body>
<header><h1>Indicadores EFQM 2028</h1></header>
<main data-codigo="$codigo" data-horizonte="$horizonte" data-archivo-horizonte="$archivo_horizonte">
<div class="indicador"><label for="indicador">Indicador</label>
<select id="indicador">$indicadores</select>
<label for="horizonte">Prospectiva</label>
<select id="horizonte">$horizontes</select></div>
<section id="opciones" aria-label="Elementos gráficos">
$controles
<label><input type="checkbox" name="prediction_interval" checked$intervalo_control> Intervalo de predicción (95 %)</label>
<div><button id="descargar" type="button">Descargar imagen PNG</button>
<button id="restablecer" type="button">Restablecer selección</button></div>
<p id="estado" role="status"></p>
</section>
<div id="grafica" tabindex="0" role="img" aria-label="$titulo. Representación desplazable horizontalmente en pantallas estrechas.">
$grafica
</div>
</main>
<script id="geometria" type="application/json">$geometria</script>
<script src="../selector.js?v=$version_selector" defer></script>
</body>
</html>
